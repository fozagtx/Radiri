[package]
name = "radiri-test-token"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OWNER/REPO"
description = "TESTNET ONLY: freely mintable NEP-141 test token with no value, used by the Radiri lending contract."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

# The release profile lives in the workspace manifest (contracts/Cargo.toml).
