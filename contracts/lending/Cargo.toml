[package]
name = "radiri-lending"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OWNER/REPO"
description = "Radiri cross-asset lending: meme coins and tokenized stocks as collateral and borrowable assets."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }
# 256-bit intermediate for amount * price products (no_std, wasm friendly).
uint = { version = "0.10.2", default-features = false }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-workspaces = { version = "0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"

# The release profile lives in the workspace manifest (contracts/Cargo.toml).
